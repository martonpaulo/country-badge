# Scan (bench-setup ci-pipelines.md, "Scan for vulnerabilities each week"): a new advisory arrives
# without a push, so the one npm package set is audited each Monday and on demand. `pnpm audit` reads
# the lockfile only. A red run is the report: GitHub mails the owner, and the fix is a dependency
# update or a recorded reason. No secret: the token only reads.
name: Scan

on:
  schedule:
    - cron: "37 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: pnpm audit
        run: pnpm audit --prod --audit-level low
