# Cheap validation: the Node test suite only. It needs no browser download, so
# it runs on every change that can affect it.
#
# The expensive Chromium acceptance suite lives in `browser.yml` and is gated on
# the paths it can actually observe. Splitting them keeps a documentation-only
# change from downloading a browser to prove nothing.
name: Validate

on:
  pull_request:
    paths:
      - "css/**"
      - "js/**"
      - "tests/unit/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]
    paths:
      - "css/**"
      - "js/**"
      - "tests/unit/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit tests
        run: npm run test:unit
