# Cheap validation: the Node test suite only. It needs no browser download, so
# it runs on every change that can affect it.
#
# The expensive Chromium acceptance suite lives in `browser.yml` and is gated on
# the paths it can actually observe. Splitting them keeps a documentation-only
# change from downloading a browser to prove nothing.
name: Validate

on:
  pull_request:
    paths:
      - "index.html"
      - "sitemap.xml"
      - "robots.txt"
      - "css/**"
      - "js/**"
      - "tests/unit/**"
      - "biome.jsonc"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "sitemap.xml"
      - "robots.txt"
      - "css/**"
      - "js/**"
      - "tests/unit/**"
      - "biome.jsonc"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and check formatting
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test:unit
